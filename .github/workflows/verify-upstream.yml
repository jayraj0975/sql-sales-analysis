name: verify-upstream
# The tests use the committed Chinook database and never touch the network. This weekly check confirms the
# upstream file is still the one whose SHA-256 is pinned, so a change there is noticed instead of ignored.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Upstream still matches the pinned checksum
        run: |
          mv data/chinook.sqlite /tmp/committed.sqlite
          python src/download_data.py
          cmp data/chinook.sqlite /tmp/committed.sqlite && echo "upstream is unchanged"
